name: USAJOBS daily fetch

on:
  schedule:
    # Weekdays at 10:30 UTC (6:30 AM Eastern in summer, 5:30 AM in winter).
    # GitHub may start scheduled runs a few minutes late.
    - cron: "30 10 * * 1-5"
  workflow_dispatch: {}   # adds a "Run workflow" button for manual tests

permissions:
  contents: read          # least privilege: the job only reads the repo

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch USAJOBS results and email the full list
        run: python3 usajobs_fetch.py
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
