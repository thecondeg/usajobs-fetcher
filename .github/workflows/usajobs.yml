name: USAJOBS daily fetch

on:
  schedule:
    # Weekdays at 10:15 UTC (6:15 AM Eastern in summer, 5:15 AM in winter),
    # well before the 6:46 AM daily digest. GitHub may start scheduled runs late.
    - cron: "15 10 * * 1-5"
  workflow_dispatch: {}   # adds a "Run workflow" button for manual tests

permissions:
  contents: read          # least privilege: the job only reads the repo

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5   # v5 runs on Node.js 24
      - name: Fetch USAJOBS results and email the full list
        run: python3 usajobs_fetch.py
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
